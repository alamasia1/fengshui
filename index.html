  <style>
    /* =========================
       RESET & GLOBAL
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-color: #0b0b17;
      --card-color: #17172a;
      --text-color: #ffffff;
      --purple: #8b5cf6;
      --pink: #ec4899;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 24px 16px;
      overflow-x: hidden;
    }

    /* =========================
       ANIMATED BACKGROUND
    ========================= */

    body::before {
      content: "";
      position: fixed;
      inset: 0;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(139, 92, 246, 0.20),
          transparent 40%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(236, 72, 153, 0.15),
          transparent 40%
        );

      z-index: -1;
      pointer-events: none;

      animation: bgMove 8s ease-in-out infinite alternate;
    }

    @keyframes bgMove {
      from {
        transform: scale(1);
        opacity: 0.7;
      }

      to {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    /* =========================
       MAIN CONTAINER
    ========================= */

    .container {
      width: 100%;
      max-width: 420px;

      background: rgba(23, 23, 42, 0.85);
      border: 1px solid rgba(255,255,255,0.10);

      border-radius: 24px;
      padding: 20px;

      box-shadow:
        0 20px 60px rgba(0,0,0,0.35);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      animation: fadeUp 0.9s ease both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       LOGO
    ========================= */

    .logo-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin-bottom: 16px;
    }

    .logo {
      display: block;
      width: min(72%, 260px);
      height: auto;
      object-fit: contain;
    }

    /* =========================
       FOTO SQUARE 1:1
    ========================= */

    .photo-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;

      position: relative;
      overflow: hidden;

      border-radius: 18px;
      background: #222238;

      border: 2px solid rgba(255,255,255,0.12);
    }

    .photo {
      display: block;
      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      transition: transform 0.5s ease;
    }

    .photo-wrapper:hover .photo {
      transform: scale(1.04);
    }

    /* =========================
       TEXT CONTENT
    ========================= */

    .content {
      text-align: center;
      margin-top: 20px;
    }

    .title {
      font-size: 23px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .description {
      font-size: 14px;
      color: #aaaac0;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    /* =========================
       BUTTON CONTAINER
    ========================= */

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;

      width: 100%;
    }

    /* =========================
       BUTTON STYLE
    ========================= */

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 56px;

      padding: 15px 20px;

      color: #ffffff;
      text-decoration: none;

      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;

      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.20);

      cursor: pointer;
      overflow: hidden;

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;

      animation: floating 2.5s ease-in-out infinite;
    }

    /* BUTTON PERTAMA */

    .btn-primary {
      background: linear-gradient(
        135deg,
        #7c3aed,
        #a855f7,
        #ec4899
      );

      box-shadow:
        0 6px 25px rgba(139,92,246,0.35);
    }

    /* BUTTON KEDUA */

    .btn-secondary {
      background: linear-gradient(
        135deg,
        #db2777,
        #ec4899,
        #f97316
      );

      box-shadow:
        0 6px 25px rgba(236,72,153,0.30);

      animation-delay: 0.6s;
    }

    /* =========================
       FLOATING ANIMATION
    ========================= */

    @keyframes floating {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    /* =========================
       SHINE EFFECT
    ========================= */

    .btn::before {
      content: "";

      position: absolute;
      top: 0;
      left: -120%;

      width: 60%;
      height: 100%;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.35),
        transparent
      );

      transform: skewX(-25deg);

      animation: shine 3.5s infinite;
    }

    @keyframes shine {
      0% {
        left: -120%;
      }

      45%, 100% {
        left: 150%;
      }
    }

    /* =========================
       HOVER EFFECT
    ========================= */

    .btn:hover {
      animation-play-state: paused;

      transform: translateY(-3px) scale(1.02);
    }

    .btn-primary:hover {
      box-shadow:
        0 10px 35px rgba(139,92,246,0.65);
    }

    .btn-secondary:hover {
      box-shadow:
        0 10px 35px rgba(236,72,153,0.65);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:focus-visible {
      outline: 3px solid white;
      outline-offset: 4px;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      margin-top: 28px;
      text-align: center;

      font-size: 12px;
      color: #77778d;
    }

    /* =========================
       RESPONSIVE MOBILE
    ========================= */

    @media (max-width: 480px) {

      body {
        padding: 16px 12px;
      }

      .container {
        padding: 15px;
        border-radius: 20px;
      }

      .logo-wrapper {
        margin-bottom: 14px;
      }

      .logo {
        width: min(76%, 230px);
      }

      .photo-wrapper {
        border-radius: 14px;
      }

      .title {
        font-size: 21px;
      }

      .description {
        font-size: 13px;
      }

      .btn {
        min-height: 54px;
        font-size: 15px;
        border-radius: 12px;
      }

      .buttons {
        gap: 15px;
      }
    }

    /* ACCESSIBILITY */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }

  </style>
